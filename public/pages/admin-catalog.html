<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Catalog - ABC Company</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin-catalog.css">
  <script src="../js/base-layout.js" defer></script>
</head>
<body data-use-base-layout="true" data-page-key="admin-catalog" data-header-title="⚙️ Manage Catalog" data-header-action-id="backBtn" data-header-action-label="← Back" data-header-action-class="btn-back">
  <template id="page-content-template">
      <div class="cache-warning">
        <strong>💡 Note:</strong> After adding/deleting items, the catalog cache will be automatically cleared. 
        Changes will appear immediately in billing pages.
      </div>

      <div class="admin-grid">
        <div class="admin-section">
          <h3>📁 Categories</h3>
          <div class="form-row">
            <input type="text" id="categoryName" placeholder="Category name">
            <button id="addCategoryBtn">Add</button>
          </div>
          <div class="success-msg" id="categorySuccess">✓ Category added!</div>
          <div class="item-list" id="categoryList">
            <div class="loading-msg">Loading...</div>
          </div>
        </div>

        <div class="admin-section">
          <h3>🔧 Materials</h3>
          <div class="form-row">
            <select id="materialCategory">
              <option value="">Select category</option>
            </select>
            <input type="text" id="materialName" placeholder="Material name">
            <button id="addMaterialBtn">Add</button>
          </div>
          <div class="success-msg" id="materialSuccess">✓ Material added!</div>
          <div class="item-list" id="materialList">
            <div class="loading-msg">Loading...</div>
          </div>
        </div>

        <div class="admin-section">
          <h3>📏 Sizes</h3>
          <div class="form-row">
            <select id="sizeMaterial">
              <option value="">Select material</option>
            </select>
            <input type="text" id="sizeValue" placeholder="Size value">
            <button id="addSizeBtn">Add</button>
          </div>
          <div class="success-msg" id="sizeSuccess">✓ Size added!</div>
          <div class="item-list" id="sizeList">
            <div class="loading-msg">Loading...</div>
          </div>
        </div>

        <div class="admin-section">
          <h3>🔩 Fittings</h3>
          <div class="form-row">
            <select id="fittingMaterial">
              <option value="">Select material</option>
            </select>
            <input type="text" id="fittingName" placeholder="Fitting name">
            <button id="addFittingBtn">Add</button>
          </div>
          <div class="success-msg" id="fittingSuccess">✓ Fitting added!</div>
          <div class="item-list" id="fittingList">
            <div class="loading-msg">Loading...</div>
          </div>
        </div>
      </div>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/billing.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/pdf-generator.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/admin-catalog-page.js"></script>
</body>
</html>
