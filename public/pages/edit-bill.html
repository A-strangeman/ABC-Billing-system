<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Bills - ABC Company</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/base-layout.js" defer></script>
</head>

<body data-use-base-layout="true" data-page-key="edit-bill" data-header-title="Saved Bills" data-header-action-id="backBtn" data-header-action-label="← Back" data-header-action-class="btn-back">
  <template id="page-content-template">
      <section class="info">
        <p>Click on any bill to view, edit, or delete it.</p>

        <div class="filter-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Search by customer name or bill number..."
          />
          <select id="sortSelect">
            <option value="date-desc">Latest First</option>
            <option value="date-asc">Oldest First</option>
            <option value="amount-desc">Highest Amount</option>
            <option value="amount-asc">Lowest Amount</option>
          </select>
        </div>

        <div id="billListContainer" class="list-container">
          <p class="loading">Loading bills...</p>
        </div>

        <div id="pagination" class="pagination"></div>
      </section>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/billing.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/pdf-generator.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/edit-bill-page.js"></script>
</body>
</html>
