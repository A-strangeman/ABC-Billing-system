<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome - ABC Company</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/base-layout.js" defer></script>
</head>
<body data-use-base-layout="true" data-page-key="welcome" data-header-title="Welcome to ABC Company" data-header-action-id="logoutBtn" data-header-action-label="Logout" data-header-action-class="btn-logout">
  <template id="page-content-template">
      <section class="welcome-grid">
        <div class="stat-card">
          <h3>Today's Bills</h3>
          <p class="stat-number" id="todayBills">0</p>
        </div>
        
        <div class="stat-card">
          <h3>This Month</h3>
          <p class="stat-number" id="monthBills">0</p>
        </div>
        
        <div class="stat-card">
          <h3>Drafts Saved</h3>
          <p class="stat-number" id="draftCount">0</p>
        </div>
        
        <div class="stat-card">
          <h3>Total Revenue</h3>
          <p class="stat-number" id="totalRevenue">₹0</p>
        </div>
      </section>

      <section class="info-section">
        <h2>📝 Recent Drafts</h2>
        <div id="draftsList" class="list-container">
          <p class="loading">Loading drafts...</p>
        </div>
      </section>

      <section class="info-section">
        <h2>📋 Recent Bills</h2>
        <div id="billsList" class="list-container">
          <p class="loading">Loading bills...</p>
        </div>
      </section>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/billing.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/pdf-generator.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/welcome-page.js"></script>
</body>
</html>
